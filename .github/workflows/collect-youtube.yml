name: Collect YouTube

# Collects videos from a curated list of tech / indie-hacker YouTube channels
# (config/youtube-channels.json) using the YOUTUBE_API_KEY. This is a permanent
# switch from the OAuth-based approach (which required a refresh token that kept
# expiring). The static channel list is maintained in config/youtube-channels.json
# and covers ~30 channels. Runs every 8h.

on:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours
  workflow_dispatch: {}

concurrency:
  group: collect-youtube
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run YouTube collector
        run: pnpm collect:youtube
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
