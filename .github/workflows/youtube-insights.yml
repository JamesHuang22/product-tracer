name: YouTube Insights

# Runs an LLM (DeepSeek) pass over each NEW video from the curated YouTube
# channel list (config/youtube-channels.json) to extract structured insight —
# trends, topics, tools mentioned, sentiment, a key takeaway, and a relevance
# score — stored in app.video_insight. Runs daily at 05:00 UTC. Uses
# YOUTUBE_API_KEY (no OAuth, no refresh token).

on:
  schedule:
    - cron: '0 5 * * *' # daily UTC 05:00 — before data-quality.yml at 06:00
  workflow_dispatch: {}

concurrency:
  group: youtube-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run YouTube insights pipeline
        run: pnpm youtube:insights
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # LLM (DeepSeek by default) — required for the insight extraction.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
